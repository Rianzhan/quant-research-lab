name: Offline research invariants
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install public test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check publication boundary
        run: python tools/check_publication.py
      - name: Run the complete public synthetic suite
        run: python -m pytest -q
      - name: Run the offline demonstration
        run: python -m examples.synthetic_research_demo
